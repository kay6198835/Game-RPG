# CCGS project configuration — migrated from v1.0 legacy files.
# Generated by .claude/scripts/migrate-v1-config.sh (2026-10-08), then completed by hand:
# null values filled from technical-preferences.md / ProjectSettings, rigor set to `standard`
# (v1.0 behaved like standard; standard expands to review_mode `lean`, which matches the old
# production/review-mode.txt). Review production/migration-report.md before running --finalize.

schema_version: 1

framework:
  version: 1.1.2
  last_upgraded: 2026-10-08

project:
  name: "Game-RPG"
  stage: Production

modes:
  rigor: standard
  # Explicit, and equal to what `standard` expands to. Kept so --finalize can verify the
  # migrated production/review-mode.txt value. Delete this line to let rigor drive review depth.
  review_mode: lean

engine:
  name: "Unity"
  version: "2022.3.62f3"
  language: "C# (.NET Standard 2.1)"
  rendering: "Universal Render Pipeline (URP) — 2D Renderer"
  physics: "Physics2D (Box2D)"

specialists:
  code: "unity-specialist"
  shader: "unity-shader-specialist"
  ui: "unity-ui-specialist"
  additional: ["unity-addressables-specialist"]

naming:
  classes: "`PascalCase` — `PlayerAttackState`, `MeleeWeapon`, `RoomGridController`"
  variables: "`_camelCase` private fields (`camelCase` for serialized legacy fields — match existing); `PascalCase` public properties"
  constants: "`UPPER_SNAKE_CASE` in `GameConstants.cs`"
  signals: "Events via `EventManager` `EventID` enum (`ON_UPPER_SNAKE`) — no C# events per class"
  files: "File name = class name (`PascalCase.cs`); known legacy mismatches listed in CLAUDE.md"
  scenes: "`PascalCase` — `LoadRandomMap`, `MainGamePlay`, `SetLevel`"

performance:
  target_framerate: 60
  frame_budget_ms: 16.7
  draw_call_limit: 100
  memory_ceiling_mb: 256

platform:
  targets: ["PC (Windows)"]
  primary_input: "Keyboard (WASD movement) + Mouse (attack direction)"
  gamepad_support: "None (demo target)"
  touch_support: "None"

testing:
  framework: "Unity Test Framework (EditMode + PlayMode)"
