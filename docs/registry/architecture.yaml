# Architecture Registry
# Locked architectural stances derived from Accepted/Proposed ADRs.
# Populated by /architecture-decision. Do not hand-edit stances without
# updating the source ADR — this file must stay a derived view, not a
# second source of truth.

state_ownership:
  - state: enemy_room_alive_count
    owner: RoomCell
    adr: ADR-0002
    adr_status: amended_2026-08-21
    interface: "RoomCell.EnemyCount (int, private set); RoomCell.OnDoneSpawnEnemy(int) / OnSpawnExtraEnemy() / OnEnemyDeath()"
    note: >
      CORRECTED 2026-08-20 by documentation audit; ADR-0002 amended 2026-08-21 to match.
      ADR-0002's original Decision assigned this state to
      EnemyManager, but the shipped owner is RoomCell (RoomCell.cs:22,44-62).
      RoomGridController forwards ON_DONE_SPAWN_ENEMY / ON_SPAWN_EXTRA_ENEMY /
      ON_ENEMY_DEATH to the current cell, and RoomCell emits ON_CLEAR_ENEMY when the
      count reaches zero. EnemyManager holds no alive-count field of any kind — it
      became the pathfinding service instead (see api_decisions below). ADR-0002's
      2026-08-21 amendment records this ownership split, so this row is authoritative
      again. The split across RoomCell / EnemySpawner / RoomGridController is itself
      covered by no ADR — recorded as owed architectural debt in that amendment.

interfaces:
  - contract: room_enemy_selection
    adr: ADR-0003
    signature: "RoomModel.GetSpawnSet() -> List<EnemySpawnEntry> { enemy, count }"
    guarantee_status: violated_by_implementation_accepted_2026-08-21
    detail: >
      Budget-bounded Candidate-Pool fill loop. Intended guarantees: totalSpend <= B
      (Room Budget) always — overspend structurally impossible because a candidate
      must satisfy weight <= remaining (no overflow cap); the loop terminates in at
      most B iterations; each pick round terminates in at most 5 roll attempts
      (retryCount capped at 4 + 1 forced fallback).
      VERIFIED 2026-08-20 — implementation status per guarantee:
        - loop termination: HOLDS (weight >= 1 is enforced by [Range(1,100)]).
        - 5 roll attempts per round: HOLDS (RoomModel.cs:55).
        - totalSpend <= B: DOES NOT HOLD. RoomModel.SetListCandidate() at
          RoomModel.cs:55-58 does `if (retry > 4) { candidateEnemies.AddRange(
          enemiesOfRoom); return; }` with no weight filter -- and no rarity roll
          either -- so a candidate heavier than the remaining budget can be picked
          and weightBudget goes negative. Real bound: totalSpend < B + max(weight).
          Measured over 20000 simulated rooms at B=100: a mixed pool whose cheapest
          weight is 20 overspends in ~4% of rooms, worst case +80 (+80% of budget).
          Reaching the fallback is NOT the same as overspending -- a Legendary-only
          pool reaches it in every room yet never overspends. Per-round fallback
          probability is 0.95^4 ~= 81.5% (four rolls, then the forced fallback);
          an earlier note here said ~77% of rounds, which was wrong on both the
          exponent and the metric. ACCEPTED 2026-08-21 (owner decision C3) and
          documented in the ADR-0003 amendment; tracked as TD-039, not scheduled.
      Also note the serialized `overflowPercent` field on RoomModel is never read —
      GetSpawnSet() uses a hardcoded 0.1f literal instead (RoomModel.cs:31).
      Pure method on the RoomModel SO — deliberately NOT on the EnemyManager
      singleton (ADR-0002) so it stays unit-testable. NOTE: it is not currently pure —
      it mutates the serialized `candidateEnemies` list as a scratch buffer, which
      makes it non-reentrant and unsafe if two rooms share a RoomModel (which
      MapModel.GetRandomRoom()'s shuffle-bag allows once the bag refills).
  - contract: enemymodal_spawn_metadata
    adr: ADR-0003
    signature: "EnemyModal { GameObject Prefab; int weight; RarityTier rarityTier; } — plain [System.Serializable] class nested in RoomModel.cs, NOT a ScriptableObject, does not extend EntityModel"
    detail: >
      AMENDED 2026-07-23 (sprint-06 S6-09): originally speced as an
      EntityModel-extending ScriptableObject with its own asset per variant;
      shipped instead as a plain class with no asset file, no GUID ID, no
      cross-room reuse — owner accepted this shape as final rather than
      migrating to SO. weight (= Cost) MUST be >= 1, enforced by
      [Range(1, 100)] on the field (Inspector-slider only, no OnValidate
      clamp) — a weight <= 0 candidate would hang the eligible-set fill loop.
      RarityTier is a fixed four-value enum whose integer value IS the
      roll-chance percent: Common=50, Rare=30, Epic=15, Legendary=5; a
      chance() mapper divides by 100. weight and rarityTier are fully
      independent by design — never cross-checked (intentional: lets a cheap
      enemy be rare or an expensive enemy be common). EnemyModal is spawn
      metadata only, not a stat store (ADR-0001 boundary) — still holds under
      the plain-class shape.

