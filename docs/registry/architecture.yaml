api_decisions:
  - decision: enemymanager_singleton_exception
    adr: ADR-0002
    detail: >
      EnemyManager uses the static-Instance singleton pattern (same shape as
      MazeController) as an explicit, time-boxed exception to the
      project-wide "no new singletons beyond MazeController" rule
      (technical-preferences.md, .claude/rules/engine-code.md,
      .claude/rules/manager-event-code.md).
      SCOPE DRIFT 2026-08-20 — the shipped EnemyManager does NOT do what ADR-0002
      describes. It is now the pathfinding service: [RequireComponent(PathRequestManager)],
      SetPathfindingGrid(), RequestPath(), GetNodeByPositionWorld(). It owns no
      aliveCount, no room lifecycle, no door locking and no ON_CLEAR_ENEMY emission —
      that work is split across EnemySpawner, RoomCell and RoomGridController, none of
      which is covered by any ADR. The singleton exception is therefore currently
      un-anchored: the class it names exists, but for a different reason than the one
      that was ratified. RESOLVED 2026-08-21 (owner decision C2): the code stays as is and
      ADR-0002 was amended to re-scope the exception onto the pathfinding role. The
      EntityMovement.Start() coupling (EntityMovement.cs:31, `grid = EnemyManager.Instance.Grid`,
      no null guard -> Entity prefabs NullRef in any scene without an EnemyManager) is recorded
      in that amendment as an accepted consequence. S10-09 can now flip Status honestly.
      The ADR's own Verification item IS satisfied: EnemyManager.Awake() has the
      `return` after Destroy(gameObject) that MazeController still lacks
      (EnemyManager.cs:15 vs MazeController.cs:17-20 / TD-026).
    scope: EnemyManager only — not a general license for new singletons.
    review_trigger:
      - "Sprint 6 code-review gate when EnemyManager is implemented"
      - "If a third singleton-shaped need arises (see TD-023, TD-031 — existing unratified violations of the same rule)"
      - "When TD-023 or TD-031 are scheduled for tech-debt repayment"
    status: accepted_exception
  - decision: enemy_spawn_selection_algorithm
    adr: ADR-0003
    detail: >
      The enemy-spawn selection algorithm is Option C — Room Budget +
      Candidate Pool + RarityTier. Per accepted pick: build the eligible set
      (weight <= remaining), roll each candidate's RarityTier chance
      independently, pick uniformly from the passers; on an empty pool retry
      up to 4 times then fall back to the full eligible set; repeat until the
      budget tolerance band is met or nothing fits. RNG stays UnityEngine.Random
      (unseeded, per GDD Open Q#2) — algorithm ACs (AC-C1..C6) do not assume
      determinism. Reuses the existing GetSpawnSet() zero-alloc scratch buffers.
    supersedes: >
      The shipped Option A two-phase uniform-random behavior and the never-built
      2026-07-08 Option B target (injected System.Random + EnemyDatabase id-lookup
      + argmin fill). Resolves GDD Open Question #8.
    scope: >
      RoomModel.GetSpawnSet() selection logic — RarityTier field done (S5-A3); algorithm rewrite LANDED between 2026-07-23 and 2026-08-20 (verified: GetSpawnSet() now builds a candidate pool, rolls each candidate's RarityTier chance, picks uniformly from the passers, and retries up to 4 times before a forced fallback — Option C in shape). The earlier note "still runs Option A as of 2026-07-23" is superseded. What is NOT done: the budget guarantee (see room_enemy_selection above) and the Phase-1/Phase-2 removal was never recorded in the GDD.
    status: accepted
    status_note: >
      Accepted 2026-07-23 against the shipped EnemyModal plain-class data shape
      (see ADR-0003 Amendment) — NOT against full implementation of the
      eight-step Candidate-Pool algorithm, which remains unbuilt. Data-model
      question (S6-09) and algorithm-rewrite question are tracked separately.
  - decision: vcontainer_dependency_injection
    adr: ADR-0004
    detail: >
      VContainer 1.19.0 is the project's dependency-injection container.
      GameLifetimeScope (Assets/Script/System/LifetimeScope/GameLifetimeScope.cs)
      is the single scene-level composition root and must be present in any
      playable scene. Cross-system services are registered with
      RegisterComponentInHierarchy<T>().As<IService>() and consumed via
      [Inject] public void Construct(...) method injection.
      Three services are exposed behind interfaces:
        IObjecPoolService   -> ObjectPoolManager  (note: 'Objec' typo is intentional)
        IPlayerService      -> PlayerManager
        IPlayerStatService  -> StatHandler
      Six further components are registered as concrete types because the
      container, not each other, consumes them: Player, EnemySpawner,
      StatsUIController, ItemSpawner, RoomGeneraterController, AbilityHolder.
      DI does NOT replace the Core hub: sibling components on one character are
      still resolved with Core.GetCoreComponent<T>(out ...). The two mechanisms
      have disjoint scopes — DI crosses systems, the hub stays within a character.
      RegisterComponentInHierarchy finds but never spawns, so runtime-spawned
      objects (pooled enemies, projectiles, items) cannot be registered; Pool.Spawn()
      injects into each new instance instead. Two registrations are commented out
      in Configure() for exactly this reason (StatsScreenUIController,
      StatPointAllocator).
      RECORDED RETROACTIVELY 2026-09-11, 20 days after the decision shipped in
      aa4e620 (2026-08-22). During that gap .claude/rules/engine-code.md instructed
      contributors to use a resolution mechanism the codebase had already moved
      past. That documentation gap is the reason ADR-0004 exists.
    scope: >
      Cross-system service resolution only. Not a license to inject concrete
      MonoBehaviour types, and not a license to resolve the container manually
      (IObjectResolver.Resolve<T>() in gameplay code is service location, not DI).
    supersedes: >
      The implicit "GetComponent or Inspector refs everywhere else" stance in
      .claude/rules/engine-code.md, which had no mechanism for cross-system
      lookups and so kept producing unratified singletons (TD-023, LevelManager).
    review_trigger:
      - "If a per-room or per-run child LifetimeScope becomes necessary (ADR-0004 Open Question #1)"
      - "When ADR-0002's EnemyManager singleton exception is re-evaluated (ADR-0004 Open Question #2)"
      - "If the VContainer git-URL dependency ever fails to resolve — vendor as an embedded package"
    status: accepted
    status_note: >
      Incomplete migration: RangeWeapon's DI wiring is still open as BUG-064
      sub-item 7, the last component reaching for a service the old way.
      Supply-chain risk: VContainer is pinned by git URL
      (jp.hadashikick.vcontainer#1.19.0), not via the Unity package registry.
